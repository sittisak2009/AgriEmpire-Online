<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / สมัครสมาชิก</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover { background-color: #45a049; }
        hr { border: 0.5px solid #444; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- ฟอร์มเข้าสู่ระบบ -->
    <h2>เข้าสู่ระบบ</h2>
    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="ชื่อผู้ใช้" required>
        <input type="password" name="password" placeholder="รหัสผ่าน" required>
        <button type="submit">เข้าสู่ระบบ</button>
    </form>

    <hr>

    <!-- ฟอร์มสมัครสมาชิก -->
    <h2>สมัครสมาชิก</h2>
    <form action="/register" method="POST">
        <input type="text" name="username" placeholder="ตั้งชื่อผู้ใช้" required>
        <input type="password" name="password" placeholder="ตั้งรหัสผ่าน" required>
        <button type="submit" style="background-color: #008CBA;">สมัครสมาชิก</button>
    </form>
</div>

</body>
          </html>
